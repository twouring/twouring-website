name: Deploy Twouring website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twouring-website-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/sitemap-index.xml

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.twouring.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$DEPLOY_PATH" in
            /opt/twouring/sites/twouring-releases) ;;
            *) echo 'DEPLOY_PATH must be /opt/twouring/sites/twouring-releases'; exit 1 ;;
          esac
          tar -C dist -czf /tmp/twouring-site.tgz .
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' && rm -rf '$DEPLOY_PATH/releases/$RELEASE_ID' && mkdir '$DEPLOY_PATH/releases/$RELEASE_ID'"
          scp /tmp/twouring-site.tgz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/site.tgz"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH/releases/$RELEASE_ID'; tar -xzf site.tgz; rm site.tgz; ln -sfn 'releases/$RELEASE_ID' '$DEPLOY_PATH/current'; test -f '$DEPLOY_PATH/current/index.html'"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-delay 2 --max-time 30 \
            --resolve "www.twouring.com:443:${{ vars.DEPLOY_HOST }}" \
            https://www.twouring.com/ -o /dev/null
